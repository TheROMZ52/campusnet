name: Android
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'wip/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash
        run: |
          L=$(grep -E "^e: |error:|What went wrong|Execution failed|Could not|Unresolved reference|AAPT|Duplicate|FAILED" build.log | sed 's#file:///home/runner/work/campusnet/campusnet/android/##' | head -70 | cut -c1-260 | awk '{printf "%s%%0A", $0}')
          echo "::error title=gradle::$L"
      - run: cp app/build/outputs/apk/release/app-release.apk CampusNet.apk
      - uses: actions/upload-artifact@v4
        with: { name: CampusNet-apk, path: android/CampusNet.apk }
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-dev; PRE=--prerelease
          if [ "$GITHUB_REF_NAME" = main ]; then TAG=android-latest; PRE=; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --target "$GITHUB_SHA" --title "CampusNet Android ($TAG)" --notes "Latest APK built from $GITHUB_REF_NAME"
          gh release upload "$TAG" CampusNet.apk --clobber
