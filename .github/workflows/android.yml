name: Android
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'wip/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash {0}
        run: |
          ls -la > ls.txt
          python3 - <<'PY'
          import os, re
          def emit(title, lines):
              print("::error title=%s::%s" % (title, "%0A".join(l[:240].replace("\r", "") for l in lines)))
          if not os.path.exists("build.log"):
              emit("no-build-log", open("ls.txt").read().splitlines()[:30])
          else:
              log = open("build.log", errors="replace").read().splitlines()
              pat = re.compile(r"^e: |What went wrong|Execution failed|Could not|Unresolved reference|AAPT|Duplicate|FAILED|error:")
              hits = [l.replace("file:///home/runner/work/campusnet/campusnet/android/", "") for l in log if pat.search(l)]
              emit("gradle-errors", hits[:60])
              emit("gradle-tail", log[-40:])
          PY
      - run: cp app/build/outputs/apk/release/app-release.apk CampusNet.apk
      - uses: actions/upload-artifact@v4
        with: { name: CampusNet-apk, path: android/CampusNet.apk }
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-dev; PRE=--prerelease
          if [ "$GITHUB_REF_NAME" = main ]; then TAG=android-latest; PRE=; fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" $PRE --target "$GITHUB_SHA" --title "CampusNet Android ($TAG)" --notes "Latest APK built from $GITHUB_REF_NAME"
          gh release upload "$TAG" CampusNet.apk --clobber
