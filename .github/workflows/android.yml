name: Android
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'wip/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/campusnet.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded Android keystore is empty."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        shell: bash {0}
        run: |
          ls -la > ls.txt
          python3 - <<'PY'
          import os, re
          def emit(title, lines):
              print("::error title=%s::%s" % (title, "%0A".join(l[:240].replace("\r", "") for l in lines)))
          if not os.path.exists("build.log"):
              emit("no-build-log", open("ls.txt").read().splitlines()[:30])
          else:
              log = open("build.log", errors="replace").read().splitlines()
              pat = re.compile(r"^e: |What went wrong|Execution failed|Could not|Unresolved reference|AAPT|Duplicate|FAILED|error:")
              hits = [l.replace("file:///home/runner/work/campusnet/campusnet/android/", "") for l in log if pat.search(l)]
              emit("gradle-errors", hits[:60])
              emit("gradle-tail", log[-40:])
          PY
      - name: Prepare versioned APK
        id: apk
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          APK_NAME="CampusNet-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: CampusNet-v${{ steps.apk.outputs.version }}
          path: android/${{ steps.apk.outputs.apk_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: CampusNet-v${{ steps.apk.outputs.version }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish versioned release and update rolling channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.apk.outputs.version }}"
          APK_NAME="${{ steps.apk.outputs.apk_name }}"
          if [ "$GITHUB_REF_NAME" = main ]; then
            VERSION_TAG="v${VERSION}"
            CHANNEL_TAG="android-latest"
            PRE=""
          else
            VERSION_TAG="android-v${VERSION}"
            CHANNEL_TAG="android-dev"
            PRE="--prerelease"
          fi

          if ! gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release create "$VERSION_TAG" $PRE --target "$GITHUB_SHA" --title "CampusNet Android v${VERSION}" --notes "Version v${VERSION} built from $GITHUB_REF_NAME at $GITHUB_SHA."
          fi
          gh release upload "$VERSION_TAG" "$APK_NAME" --clobber

          if ! gh release view "$CHANNEL_TAG" >/dev/null 2>&1; then
            gh release create "$CHANNEL_TAG" $PRE --target "$GITHUB_SHA" --title "CampusNet Android ($CHANNEL_TAG)" --notes "Rolling channel. Versioned APK assets are retained for previous releases."
          fi
          gh release upload "$CHANNEL_TAG" "$APK_NAME" --clobber
