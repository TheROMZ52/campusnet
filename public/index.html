<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusNet</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="chat">
<div id="login">
  <form id="loginForm" class="pane" autocomplete="off">
    <div class="pt"><span id="siteName">CampusNet</span> &mdash; sign in</div>
    <div class="pb">
      <label>Username<input id="nameIn" maxlength="20" required autofocus spellcheck="false"></label>
      <label id="codeRow" hidden>Access code<input id="codeIn" type="password"></label>
      <button class="btn" type="submit">Connect</button>
      <p id="loginErr" class="err" role="alert"></p>
      <p class="dim">2-20 characters: letters, digits, _ . -</p>
    </div>
  </form>
</div>

<div id="app" hidden>
  <header id="bar">
    <b id="siteBar">CampusNet</b>
    <span id="meBar"></span>
    <span id="stat" class="dim">connecting</span>
    <span id="clock" class="dim"></span>
  </header>
  <main>
    <aside id="left">
      <section class="pane"><div class="pt">Rooms</div><ul id="rooms" class="list"></ul></section>
      <section class="pane grow"><div class="pt">Online <span id="ucount"></span></div><ul id="users" class="list"></ul></section>
    </aside>
    <section id="center" class="pane">
      <div class="pt" id="convTitle"></div>
      <div id="log" role="log" aria-live="polite"></div>
      <form id="form"><input id="inp" maxlength="1000" placeholder="Message, or /help" autocomplete="off"><button class="btn" type="submit">Send</button></form>
    </section>
    <aside id="right" class="pane">
      <div class="pt">Shared files</div>
      <div id="drop"><span>Drop files here</span><button class="btn" id="pick" type="button">Choose files</button><input id="fileIn" type="file" multiple hidden><small id="limit" class="dim"></small></div>
      <div id="prog"></div>
      <ul id="files" class="list"></ul>
    </aside>
  </main>
  <nav id="tabs">
    <button data-t="rooms">Rooms</button><button data-t="chat" class="on">Chat</button><button data-t="files">Files</button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
